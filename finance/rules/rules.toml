# ---------------------------------------------------------------- rules
# Lowest priority number runs first. The first rule with set_ignore wins and
# stops. Otherwise each matching rule fills in fields not yet set.

[[rule]]
priority = 1
name = "Internal Liberalia and accountant threads are not money documents"
match_sender = "laura l[óo]pez|jorge espejo|iratxe plaza|julia ni[ñn]o|vanesa allonca|j\\. farrell - liberalia"
set_ignore = true

[[rule]]
priority = 2
name = "Booking and reservation notices carry no charge"
match_subject = "reservation (is )?confirmed|your reservation|booking confirmation for|has just been posted|manage your booking|order will be shipping|ordered:|pedido:|entregado|order details|automatic reply|respuesta autom|out of office|one-time password|confirming your|reminder ?:|is out for delivery|shipment from order|your booking is cancelled|payment confirmation$|disponibilidad factura|confirma la actualizaci"
set_ignore = true

[[rule]]
priority = 3
name = "Terms and conditions attachments"
match_subject = "condiciones del transporte|terms and conditions"
set_ignore = true

[[rule]]
priority = 10
name = "Soho House £15 bookings are restaurant deposits"
match_sender = "^soho house$"
match_subject = "booking is confirmed|booking has been updated|booking is cancelled"
set_category = "meals"
set_doc_type = "booking"

[[rule]]
priority = 20
name = "E-tickets and seat receipts are tickets"
match_subject = "e-ticket|billete|seats receipt|electronic ticket"
set_doc_type = "eticket"

[[rule]]
priority = 21
name = "Flight booking confirmations: amount lives on the e-ticket, keep as booking"
match_subject = "booking confirmation [A-Z0-9]{6}|confirmation of booking|booking change confirmation"
set_doc_type = "booking"

[[rule]]
priority = 30
name = "Uber in GBP is London work travel"
match_sender = "uber receipts"
match_subject = "trip with uber"
set_recharge_to = "SQUARETRADE"
set_bearer = "FARRELL_IMPORT"
notes = "Classifier applies this only when currency is GBP. EUR trips stay personal."

[[rule]]
priority = 40
name = "Company on the document decides the bearer"
match_entity_on_doc = "Liberalia"
set_bearer = "LIBERALIA"

[[rule]]
priority = 41
name = "Company on the document decides the bearer"
match_entity_on_doc = "Brethil"
set_bearer = "BRETHIL"

[[rule]]
priority = 42
name = "Company on the document decides the bearer"
match_entity_on_doc = "Farrell Import"
set_bearer = "FARRELL_IMPORT"

[[rule]]
priority = 90
name = "Credit notes and refunds"
match_subject = "credit note|refund"
set_doc_type = "credit_note"
